# Historical filename retained so the existing PR/push workflow is updated in place.
# This workflow ONLY verifies source and uploads a CI artifact; it never signs or publishes.
name: Verify MojiSurvivor (Bun/Vite)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mojisurvivor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Node.js for Vite 8 compatibility
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Record toolchain versions
        run: |
          node --version
          bun --version

      - name: Install from committed lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Run regression tests
        run: bun run test

      - name: Build production web bundle
        run: bun run build

      - name: Validate expected build entry points
        run: |
          test -s dist/index.html
          test -s dist/build-manifest.json

      - name: Preserve verified build without deployment
        uses: actions/upload-artifact@v4
        with:
          name: MojiSurvivor-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
